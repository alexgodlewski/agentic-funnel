name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare local env
        run: cp .env.example .env

      - name: Typecheck web
        run: pnpm check:web

      - name: Typecheck worker
        run: pnpm check:worker

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
